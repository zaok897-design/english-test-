<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шалгалт — English Exam</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f7fc;color:#0f172a;padding:20px}
.wrap{max-width:800px;margin:0 auto}
h1{text-align:center;color:#2563eb;margin-bottom:20px}
.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 16px rgba(0,0,0,.08);margin-bottom:16px}
.btn{padding:12px 22px;border-radius:10px;font-size:14px;font-weight:bold;border:none;cursor:pointer;margin:4px}
.bp{background:#2563eb;color:#fff}
.bp:hover{background:#1d4ed8}
.bo{background:#fff;color:#333;border:1.5px solid #ddd}
.bo:hover{border-color:#2563eb;color:#2563eb}
.bs{background:#16a34a;color:#fff}
.bd{background:#dc2626;color:#fff}
.year-card{background:#fff;border-left:5px solid #2563eb;border-radius:12px;padding:18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.year{font-size:26px;font-weight:800;color:#1e3a8a}
.qtext{font-size:17px;font-weight:600;margin:16px 0;line-height:1.5}
.opt{display:block;width:100%;text-align:left;padding:12px 16px;margin-bottom:8px;border-radius:10px;border:1.5px solid #ddd;background:#fff;font-size:15px;cursor:pointer}
.opt:hover{border-color:#2563eb;background:#f0f7ff}
.opt.sel{background:#2563eb;color:#fff;border-color:#2563eb}
input,select{width:100%;padding:12px;border-radius:10px;border:1.5px solid #ddd;font-size:15px;margin-top:6px;margin-bottom:14px}
label{font-size:13px;font-weight:bold;color:#555}
.hide{display:none}
.timer{background:#dbeafe;color:#1d4ed8;padding:8px 16px;border-radius:10px;font-weight:800;font-size:18px;display:inline-block}
.info{background:#eff6ff;color:#1e40af;padding:12px;border-radius:10px;margin-bottom:14px;font-size:14px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.nav button{width:38px;height:38px;border-radius:8px;border:1.5px solid #ddd;background:#fff;font-weight:bold;cursor:pointer}
.nav button.ok{background:#dbeafe;color:#1d4ed8;border-color:#93b4f5}
.nav button.cur{background:#2563eb;color:#fff}
.progress{height:6px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin:12px 0}
.pbar{height:100%;width:0;background:#2563eb;transition:.3s}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th,td{padding:10px;text-align:left;border-bottom:1px solid #eee}
th{background:#f8fafc;font-size:12px;color:#666;text-transform:uppercase}
.tabs{display:flex;gap:8px;margin-bottom:16px;justify-content:center;flex-wrap:wrap}
.tab{padding:10px 20px;border-radius:10px;background:#fff;border:1.5px solid #ddd;font-weight:bold;cursor:pointer}
.tab.act{background:#2563eb;color:#fff;border-color:#2563eb}
@media(max-width:600px){body{padding:12px}.qtext{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
<h1>📝 English Exam Portal</h1>

<div class="tabs">
  <div class="tab act" data-t="home" onclick="tab('home')">Шалгалт</div>
  <div class="tab" data-t="teacher" onclick="tab('teacher')">👨‍🏫 Багш</div>
</div>

<!-- HOME -->
<div id="p-home">
  <div class="card">
    <h2 style="color:#2563eb;margin-bottom:14px">Жил сонгох</h2>
    <div id="yearList"></div>
  </div>
</div>

<!-- STUDENT INFO -->
<div id="p-start" class="hide">
  <div class="card">
    <h2 style="color:#2563eb;margin-bottom:14px">Сурагчийн мэдээлэл</h2>
    <div class="info" id="examInfo"></div>
    <label>Овог нэр</label>
    <input type="text" id="sName" placeholder="Бат-Эрдэнэ Тэмүүлэн">
    <label>Анги</label>
    <input type="text" id="sClass" placeholder="11А">
    <button class="btn bp" onclick="startExam()">Эхлэх →</button>
    <button class="btn bo" onclick="tab('home')">← Буцах</button>
  </div>
</div>

<!-- EXAM -->
<div id="p-exam" class="hide">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div>
        <div id="exTitle" style="font-weight:800"></div>
        <div id="exStudent" style="font-size:13px;color:#666"></div>
      </div>
      <div class="timer" id="timer">30:00</div>
    </div>
    <div class="progress"><div class="pbar" id="pbar"></div></div>
    <div id="qNum" style="font-size:12px;font-weight:800;color:#2563eb">АСУУЛТ 1</div>
    <div class="qtext" id="qText"></div>
    <div id="qOpts"></div>
    <div class="nav" id="qNav"></div>
    <div style="margin-top:16px">
      <button class="btn bo" id="prevBtn" onclick="prevQ()">← Өмнөх</button>
      <button class="btn bp" id="nextBtn" onclick="nextQ()">Дараах →</button>
      <button class="btn bs" onclick="submitExam()">✓ Дуусгах</button>
    </div>
  </div>
</div>

<!-- DONE -->
<div id="p-done" class="hide">
  <div class="card" style="text-align:center;padding:50px 20px">
    <div style="font-size:70px">✅</div>
    <h2 style="color:#16a34a;margin:14px 0">Баярлалаа!</h2>
    <p style="color:#666">Та шалгалтаа амжилттай дуусгалаа.</p>
    <p style="color:#666;font-size:14px;margin-top:8px">Оноог зөвхөн багш харна.</p>
    <button class="btn bp" style="margin-top:20px" onclick="tab('home')">🏠 Нүүр</button>
  </div>
</div>

<!-- TEACHER LOGIN -->
<div id="p-tlogin" class="hide">
  <div class="card" style="max-width:400px;margin:0 auto">
    <h2 style="text-align:center;color:#2563eb;margin-bottom:14px">🔐 Багшийн хэсэг</h2>
    <label>Нууц үг</label>
    <input type="password" id="tPass" placeholder="••••••••">
    <button class="btn bp" onclick="tLogin()">Нэвтрэх</button>
    <div id="tErr" style="color:red;font-size:13px;margin-top:8px"></div>
  </div>
</div>

<!-- TEACHER -->
<div id="p-teacher" class="hide">
  <div class="card">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px">
      <h2 style="color:#2563eb">👨‍🏫 Багшийн хэсэг</h2>
      <div>
        <button class="btn bo" onclick="changePass()">🔑 Нууц үг солих</button>
        <button class="btn bd" onclick="clearAll()">🗑 Бүгдийг устгах</button>
        <button class="btn bp" onclick="tLogout()">Гарах</button>
      </div>
    </div>
    <div id="tStats"></div>
    <h3 style="margin:16px 0 10px;font-size:16px">Сурагчдын үр дүн</h3>
    <div id="tTable"></div>
  </div>
</div>

</div>

{q:'Solution to flood.',o:['stonework','wind turbines','dams and canals','tunnels and subways','sea barrier'],a:2},
{q:'Hit the nail on the head.',o:['Caused by failures','Staff did exactly right','Not bad','Quite smart','Hit box of nails'],a:1},
{q:'Gift horse in the mouth.',o:['Give back','Bad gift','Not complain about gift','Never receive','Receiving horse hobby'],a:2}]}
};

var S={sel:null,name:'',cls:'',ans:[],cur:0,tid:null,rem:0,start:0,done:false};

function tab(id){
  var ps=document.querySelectorAll('[id^="p-"]');
  for(var i=0;i<ps.length;i++) ps[i].classList.add('hide');
  document.getElementById('p-'+id).classList.remove('hide');
  var ts=document.querySelectorAll('.tab');
  for(var i=0;i<ts.length;i++) ts[i].classList.remove('act');
  if(id==='home'){document.querySelector('[data-t="home"]').classList.add('act');stopTimer();}
  if(id==='teacher'||id==='tlogin'){document.querySelector('[data-t="teacher"]').classList.add('act');}
  window.scrollTo(0,0);
}

function renderYears(){
  var box=document.getElementById('yearList');
  box.innerHTML='';
  var years=Object.keys(EXAMS).sort();
  for(var i=0;i<years.length;i++){
    var y=years[i];
    var d=document.createElement('div');
    d.className='year-card';
    d.innerHTML='<div class="year">'+y+'</div>'+
      '<div style="color:#666;font-size:13px;margin-top:4px">'+EXAMS[y].A.length+' асуулт · 30 минут</div>'+
      '<div style="margin-top:12px">'+
      '<button class="btn bp" onclick="pick(\''+y+'\',\'A\')">A хувилбар</button>'+
      '<button class="btn bo" onclick="pick(\''+y+'\',\'B\')">B хувилбар</button></div>';
    box.appendChild(d);
  }
}

function pick(year,version){
  S.sel={year:year,version:version,qs:EXAMS[year][version]};
  document.getElementById('examInfo').innerHTML='<b>'+year+' он · '+version+' хувилбар</b><br>Асуулт: '+EXAMS[year][version].length+' · Хугацаа: 30 минут';
  tab('start');
}

function startExam(){
  var n=document.getElementById('sName').value.trim();
  var c=document.getElementById('sClass').value.trim();
  if(!n||!c){alert('Овог нэр, ангиа бөглөнө үү!');return;}
  S.name=n;S.cls=c;
  S.ans=[];for(var i=0;i<S.sel.qs.length;i++)S.ans[i]=null;
  S.cur=0;S.done=false;S.start=Date.now();S.rem=1800;
  document.getElementById('exTitle').textContent=S.sel.year+' · '+S.sel.version;
  document.getElementById('exStudent').textContent=n+' · '+c;
  tab('exam');renderQ();renderNav();startTimer();
}

function startTimer(){
  stopTimer();updTimer();
  S.tid=setInterval(function(){
    S.rem--;updTimer();
    if(S.rem<=0){stopTimer();submitExam(true);}
  },1000);
}
function stopTimer(){if(S.tid){clearInterval(S.tid);S.tid=null;}}
function updTimer(){
  var m=Math.floor(S.rem/60),s=S.rem%60;
  var t=document.getElementById('timer');
  t.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  if(S.rem<=60)t.style.background='#fee2e2',t.style.color='#dc2626';
  else if(S.rem<=300)t.style.background='#fef3c7',t.style.color='#b45309';
}

function renderQ(){
  var q=S.sel.qs[S.cur];
  document.getElementById('qNum').textContent='АСУУЛТ '+(S.cur+1)+' / '+S.sel.qs.length;
  document.getElementById('qText').textContent=q.q;
  var box=document.getElementById('qOpts');box.innerHTML='';
  var L=['A','B','C','D','E','F'];
  for(var i=0;i<q.o.length;i++){
    (function(i){
      var b=document.createElement('button');
      b.className='opt'+(S.ans[S.cur]===i?' sel':'');
      b.innerHTML='<b>'+L[i]+'.</b> '+q.o[i];
      b.onclick=function(){S.ans[S.cur]=i;renderQ();renderNav();};
      box.appendChild(b);
    })(i);
  }
  document.getElementById('prevBtn').disabled=(S.cur===0);
  document.getElementById('nextBtn').style.display=(S.cur===S.sel.qs.length-1)?'none':'inline-block';
  document.getElementById('pbar').style.width=((S.cur+1)/S.sel.qs.length*100)+'%';
}

function renderNav(){
  var nav=document.getElementById('qNav');nav.innerHTML='';
  for(var i=0;i<S.sel.qs.length;i++){
    (function(i){
      var b=document.createElement('button');
      b.textContent=i+1;
      if(S.ans[i]!==null)b.className='ok';
      if(i===S.cur)b.className='cur';
      b.onclick=function(){S.cur=i;renderQ();renderNav();};
      nav.appendChild(b);
    })(i);
  }
}

function nextQ(){if(S.cur<S.sel.qs.length-1){S.cur++;renderQ();renderNav();}}
function prevQ(){if(S.cur>0){S.cur--;renderQ();renderNav();}}

function submitExam(auto){
  if(S.done)return;
  if(!auto){
    var un=0;for(var i=0;i<S.ans.length;i++)if(S.ans[i]===null)un++;
    if(!confirm(un>0?'Танд '+un+' хариулаагүй асуулт байна. Дуусгах уу?':'Дуусгах уу?'))return;
  }
  S.done=true;stopTimer();
  var sc=0;for(var i=0;i<S.sel.qs.length;i++)if(S.ans[i]===S.sel.qs[i].a)sc++;
  var total=S.sel.qs.length;
  var pct=Math.round(sc/total*100);
  var r={ts:new Date().toISOString(),name:S.name,cls:S.cls,year:S.sel.year,ver:S.sel.version,sc:sc,total:total,pct:pct};
  var all=getResults();all.push(r);saveResults(all);
  tab('done');
}

function tLogin(){
  var p=document.getElementById('tPass').value;
  if(p===getPass()){
    document.getElementById('tErr').textContent='';
    document.getElementById('tPass').value='';
    renderTeacher();tab('teacher');
  } else {
    document.getElementById('tErr').textContent='Нууц үг буруу!';
  }
}

function renderTeacher(){
  var all=getResults();
  var stats=document.getElementById('tStats');
  if(!all.length){stats.innerHTML='<div style="text-align:center;padding:30px;color:#666">Үр дүн байхгүй</div>';}
  else{
    var sum=0,best=0,pass=0;
    for(var i=0;i<all.length;i++){sum+=all[i].pct;if(all[i].pct>best)best=all[i].pct;if(all[i].pct>=60)pass++;}
    var avg=Math.round(sum/all.length);
    stats.innerHTML='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px">'+
      '<div class="card" style="text-align:center;padding:14px"><div style="font-size:24px;font-weight:800;color:#2563eb">'+all.length+'</div><div style="font-size:12px;color:#666">Нийт</div></div>'+
      '<div class="card" style="text-align:center;padding:14px"><div style="font-size:24px;font-weight:800;color:#0ea5e9">'+avg+'%</div><div style="font-size:12px;color:#666">Дундаж</div></div>'+
      '<div class="card" style="text-align:center;padding:14px"><div style="font-size:24px;font-weight:800;color:#16a34a">'+best+'%</div><div style="font-size:12px;color:#666">Хамгийн өндөр</div></div>'+
      '<div class="card" style="text-align:center;padding:14px"><div style="font-size:24px;font-weight:800;color:#f59e0b">'+pass+'/'+all.length+'</div><div style="font-size:12px;color:#666">Тэнцсэн</div></div></div>';
  }
  var t=document.getElementById('tTable');
  if(!all.length){t.innerHTML='';return;}
  var html='<table><thead><tr><th>#</th><th>Огноо</th><th>Нэр</th><th>Анги</th><th>Жил</th><th>Хув.</th><th>Оноо</th><th>%</th></tr></thead><tbody>';
  var sorted=all.slice().sort(function(a,b){return new Date(b.ts)-new Date(a.ts)});
  for(var i=0;i<sorted.length;i++){
    var r=sorted[i];
    html+='<tr><td>'+(i+1)+'</td><td>'+r.ts.slice(0,10)+'</td><td><b>'+r.name+'</b></td><td>'+r.cls+'</td><td>'+r.year+'</td><td>'+r.ver+'</td><td>'+r.sc+'/'+r.total+'</td><td><b>'+r.pct+'%</b></td></tr>';
  }
  html+='</tbody></table>';
  t.innerHTML=html;
}

function tLogout(){tab('home');}

function changePass(){
  var old=prompt('Одоогийн нууц үг:');
  if(old!==getPass()){alert('Буруу!');return;}
  var np=prompt('Шинэ нууц үг (4+ тэмдэгт):');
  if(!np||np.length<4){alert('Хамгийн багадаа 4 тэмдэгт!');return;}
  var np2=prompt('Шинэ нууц үг давтах:');
  if(np!==np2){alert('Таарахгүй!');return;}
  localStorage.setItem(PASSWORD_KEY,np);
  alert('✓ Нууц үг солигдлоо!');
}

function clearAll(){
  if(!confirm('Бүх үр дүнг устгах уу?'))return;
  localStorage.removeItem(RESULTS_KEY);
  renderTeacher();
}

renderYears();
</script>
</body>
</html>
